apiVersion: auth.halo.run/v1alpha1
kind: AuthProvider
metadata:
  name: wechat
  labels:
    auth.halo.run/auth-binding: "true"
spec:
  displayName: 微信
  description: 使用微信账号登录
  logo: /plugins/juhedenglu/assets/static/wechat.jpg
  website: https://weixin.qq.com
  authenticationUrl: /login/mapay/authorize/wechat
  bindingUrl: /login/mapay/authorize/wechat
  unbindUrl: /apis/uc.api.auth.halo.run/v1alpha1/user-connections/wechat/disconnect
  authType: oauth2
  settingRef:
    name: mapay-setting
    group: mapay
---
apiVersion: auth.halo.run/v1alpha1
